
name: RaceDayAPI CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDayAPI.sln

      - name: Build solution
        run: dotnet build RaceDayAPI.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDayAPI.sln --configuration Release --no-build
